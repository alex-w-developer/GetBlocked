name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies if needed
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Run canonical validation suite
        run: npm run check

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Run required browser integration tests
        run: npm run test:browser -- --required
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          # Unpacked automation builds lack Ubuntu's installed-browser sandbox profile.
          # Use this only in the disposable GitHub-hosted test environment.
          CHROME_NO_SANDBOX: '1'
